name: PR Check

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '18'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          CI: true
        id: test

      - name: Extract test coverage
        run: |
          COVERAGE=$(grep -o 'All files[^%]*%' coverage/lcov-report/index.html | grep -o '[0-9.]*%' | head -1 || echo "0%")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        id: extract-coverage

      - name: Build project
        run: npm run build

      - name: Check bundle size and capture output
        run: npm run bundlesize > bundlesize.txt
        id: bundlesize

      - name: Extract bundle size summary
        run: |
          TOTAL_SIZE=$(grep 'Total:' bundlesize.txt | head -1 | awk '{print $2, $3, $4, $5, $6, $7}')
          MAIN_ENTRY=$(grep -A 3 'Main Entry Points:' bundlesize.txt | tail -n +2)
          echo "TOTAL_SIZE=$TOTAL_SIZE" >> $GITHUB_ENV
          echo "MAIN_ENTRY<<EOF" >> $GITHUB_ENV
          echo "$MAIN_ENTRY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          SUMMARY=$(head -30 bundlesize.txt)
          echo "BUNDLE_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        id: extract-bundlesize

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const totalSize = process.env.TOTAL_SIZE || 'N/A';
            const mainEntry = process.env.MAIN_ENTRY || 'N/A';
            const bundleSummary = process.env.BUNDLE_SUMMARY || 'N/A';
            const coverage = process.env.COVERAGE || 'N/A';
            const testStatus = '${{ steps.test.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED';

            const commentBody = [
              '## 🚀 PR Check Results',
              '',
              `### ✅ **Tests Status**`,
              `- **Status**: ${testStatus}`,
              `- **Coverage**: ${coverage}`,
              '',
              '### 📦 **Bundle Size**',
              `- **Total**: ${totalSize}`,
              '',
              '#### 📋 Main Entry Points',
              '```',
              mainEntry,
              '```',
              '',
              '#### 📊 Bundle Size Report (first 30 lines)',
              '```',
              bundleSummary,
              '```',
              '',
              '### 📋 **Build Status**',
              '- **Status**: ✅ SUCCESS',
              '- **Linting**: ✅ PASSED',
              '- **TypeScript Compilation**: ✅ SUCCESS',
              '',
              '---',
              '*This comment was automatically generated by GitHub Actions*'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## 🚀 PR Check Results')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  # Separate job for failure comments
  failure-comment:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: failure() && github.event_name == 'pull_request'

    steps:
      - name: Comment on failure
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = [
              '## ❌ PR Check Failed',
              '',
              'The following checks failed:',
              '- Tests',
              '- Build process',
              '- Bundle size analysis',
              '',
              'Please fix the issues and push new commits to trigger a re-run.',
              '',
              '---',
              '*This comment was automatically generated by GitHub Actions*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
